<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章 · awaw_a</title>
<link rel="icon" type="image/png" href="/favicon.png">
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --paper: #f7f4ea;
    --paper-soft: #fffdf7;
    --ink: #263126;
    --muted: #687260;
    --leaf: #587447;
    --leaf-dark: #33492d;
    --sprout: #91ad77;
    --tomato: #c86b53;
    --amber: #d1a14b;
    --line: #ded8c9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: 'Noto Sans SC', sans-serif;
    overflow-x: hidden;
    color: var(--ink);
    background:
      linear-gradient(90deg, rgba(88,116,71,0.08) 1px, transparent 1px),
      linear-gradient(0deg, rgba(88,116,71,0.08) 1px, transparent 1px),
      repeating-linear-gradient(135deg, rgba(255,255,255,0) 0 28px, rgba(200,107,83,0.045) 28px 29px),
      linear-gradient(135deg, #fbf9f1 0%, #eef4e7 48%, #f7efe3 100%);
    background-size: 42px 42px, 42px 42px, auto, auto;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(88,116,71,0.16), transparent 26%);
    opacity: 0.55;
  }

  .site-nav {
    background: rgba(255,253,247,0.78);
    border: 1px solid rgba(88,116,71,0.18);
    box-shadow: 0 18px 45px rgba(38,49,38,0.09);
  }
  .brand { color: var(--leaf-dark); letter-spacing: 0; }

  .nav-link {
    position: relative;
    color: var(--muted);
    transition: color 0.25s ease;
    cursor: pointer;
  }
  .nav-link::after {
    content: '';
    position: absolute;
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 2px;
    background: var(--tomato);
    border-radius: 999px;
    transition: width 0.25s ease;
  }
  .nav-link:hover,
  .nav-link.active { color: var(--leaf-dark); }
  .nav-link:hover::after,
  .nav-link.active::after { width: 70%; }

  .social-icon {
    color: #777f71;
    transition: color 0.25s ease, transform 0.25s ease;
  }
  .social-icon:hover { transform: scale(1.14) translateY(-2px); }
  .social-icon.bilibili:hover { color: #00aeec; }
  .social-icon.github:hover { color: #2f342f; }

  .menu-button {
    color: var(--leaf-dark);
    transition: color 0.25s ease, transform 0.25s ease;
  }
  .menu-button:hover { color: var(--tomato); transform: translateY(-1px); }

  .mobile-menu {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, opacity 0.35s ease;
    opacity: 0;
  }
  .mobile-menu.open {
    max-height: 280px;
    opacity: 1;
  }
  .mobile-panel {
    background: rgba(255,253,247,0.86);
    border: 1px solid rgba(88,116,71,0.18);
    box-shadow: 0 18px 42px rgba(38,49,38,0.08);
  }
  .mobile-panel a,
  .mobile-panel span { color: var(--muted); }
  .mobile-panel .active-mobile,
  .mobile-panel a:hover { color: var(--leaf-dark); }

  .article-shell {
    position: relative;
    z-index: 1;
  }

  .article-card {
    background: rgba(255,253,247,0.82);
    border: 1px solid rgba(88,116,71,0.16);
    box-shadow: 0 18px 52px rgba(38,49,38,0.1);
  }

  .article-title {
    color: var(--ink);
    letter-spacing: 0;
  }
  .article-date {
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }
  .title-mark {
    width: 3rem;
    height: 0.22rem;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--leaf), var(--tomato));
    opacity: 0.72;
  }

  .back-link {
    color: var(--leaf);
    transition: color 0.2s ease, transform 0.2s ease;
  }
  .back-link:hover {
    color: var(--tomato);
    transform: translateX(-2px);
  }
  .back-button {
    color: #fffdf7;
    background: var(--leaf-dark);
    box-shadow: 0 12px 26px rgba(51,73,45,0.2);
    transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }
  .back-button:hover {
    background: var(--tomato);
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(200,107,83,0.2);
  }

  .prose {
    color: var(--ink) !important;
  }
  .prose h1 {
    color: var(--ink) !important;
    font-size: 2rem !important;
    font-weight: 900 !important;
    letter-spacing: 0 !important;
  }
  .prose h2 {
    color: var(--leaf-dark) !important;
    font-weight: 800 !important;
    margin-top: 1.85rem !important;
    padding-bottom: 0.4rem;
    border-bottom: 2px solid rgba(88,116,71,0.18);
  }
  .prose h3 {
    color: var(--ink) !important;
  }
  .prose p,
  .prose li {
    color: #465040 !important;
  }
  .prose blockquote {
    color: #4d613f !important;
    border-left-color: var(--sprout) !important;
    background: linear-gradient(90deg, rgba(145,173,119,0.18), rgba(255,253,247,0));
    padding: 0.75rem 1.25rem !important;
    border-radius: 0 0.75rem 0.75rem 0;
  }
  .prose a {
    color: var(--leaf) !important;
    text-decoration: none !important;
    border-bottom: 1px dashed rgba(88,116,71,0.42);
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .prose a:hover {
    color: var(--tomato) !important;
    border-bottom-color: var(--tomato);
  }
  .prose code {
    background: rgba(145,173,119,0.16) !important;
    color: var(--leaf-dark) !important;
    padding: 0.15em 0.42em !important;
    border-radius: 4px;
    font-size: 0.9em;
    font-family: 'JetBrains Mono', monospace !important;
  }
  .prose pre {
    background: #263126 !important;
    border-radius: 1rem !important;
    box-shadow: 0 14px 34px rgba(38,49,38,0.16);
  }
  .prose pre code {
    background: transparent !important;
    color: #f7f4ea !important;
    padding: 0 !important;
  }
  .prose img {
    border-radius: 1rem !important;
    border: 1px solid rgba(88,116,71,0.14);
    box-shadow: 0 12px 34px rgba(38,49,38,0.1);
  }
  .prose ul li::marker,
  .prose ol li::marker {
    color: var(--tomato);
  }
  .prose hr {
    border-color: rgba(88,116,71,0.16) !important;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  .loader {
    border: 3px solid rgba(88,116,71,0.16);
    border-top-color: var(--leaf);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeIn 0.5s ease forwards; }

  .error-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 4rem;
    height: 4rem;
    border-radius: 999px;
    color: var(--tomato);
    background: rgba(200,107,83,0.12);
    border: 1px solid rgba(200,107,83,0.18);
  }
</style>
</head>
<body>

  <!-- 导航栏 -->
  <nav class="fixed top-0 left-0 right-0 z-50">
    <div class="mx-auto max-w-6xl px-4 py-3 md:py-4">
      <div class="site-nav backdrop-blur-xl rounded-2xl px-5 md:px-10 py-3 md:py-4 flex items-center justify-between">
        <a href="/" class="brand text-xl md:text-3xl font-bold">awaw_a</a>
        <div class="hidden md:flex items-center gap-10">
          <a href="/" class="nav-link text-sm font-medium">首页</a>
          <a href="/chat" class="nav-link text-sm font-medium">聊天</a>
          <a href="/blog" class="nav-link active text-sm font-bold">博客</a>
          <a href="/changelog" class="nav-link text-sm font-medium">日志</a>
        </div>
        <div class="hidden md:flex items-center gap-5">
          <a href="https://space.bilibili.com/1605536939?spm_id_from=333.788.0.0" target="_blank" rel="noopener" class="social-icon bilibili" aria-label="Bilibili"><i class="fa-brands fa-bilibili text-xl"></i></a>
          <a href="https://github.com/awaw-a" target="_blank" rel="noopener" class="social-icon github" aria-label="GitHub"><i class="fa-brands fa-github text-xl"></i></a>
        </div>
        <button id="menuBtn" class="menu-button md:hidden p-1" aria-label="菜单"><i id="menuIcon" class="fa-solid fa-bars text-xl"></i></button>
      </div>
      <div id="mobileMenu" class="mobile-menu md:hidden">
        <div class="mobile-panel backdrop-blur-xl rounded-xl mt-2 px-6 py-5 flex flex-col gap-4">
          <a href="/" class="text-sm font-medium">首页</a>
          <a href="/chat" class="text-sm font-medium">聊天</a>
          <a href="/blog" class="active-mobile text-sm font-bold">博客</a>
          <a href="/changelog" class="text-sm font-medium">日志</a>
          <div class="flex gap-5 pt-3 border-t" style="border-color: rgba(88,116,71,0.16);">
            <a href="https://space.bilibili.com/1605536939?spm_id_from=333.788.0.0" target="_blank" rel="noopener" class="social-icon bilibili" aria-label="Bilibili"><i class="fa-brands fa-bilibili text-xl"></i></a>
            <a href="https://github.com/awaw-a" target="_blank" rel="noopener" class="social-icon github" aria-label="GitHub"><i class="fa-brands fa-github text-xl"></i></a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- 文章内容 -->
  <main class="article-shell pt-28 md:pt-36 pb-20 px-4">
    <div class="mx-auto max-w-3xl">

      <div class="mb-5">
        <a href="/blog" class="back-link inline-flex items-center gap-2 text-sm font-bold">
          <i class="fa-solid fa-arrow-left text-xs"></i> 返回博客
        </a>
      </div>

      <article class="article-card rounded-2xl p-5 md:p-8">
        <!-- 头部（加载前） -->
        <div id="articleHeader" class="mb-8 text-center">
          <div class="flex justify-center py-12">
            <div class="loader"></div>
          </div>
          <p class="muted-text text-sm">加载中...</p>
        </div>

        <!-- Markdown 内容区 -->
        <div id="articleBody" class="fade-in hidden">
          <div id="markdownContent" class="prose prose-slate mx-auto max-w-none"></div>
          <div class="mt-12 pt-8 text-center" style="border-top: 1px solid rgba(88,116,71,0.16);">
            <a href="/blog" class="back-link inline-flex items-center gap-2 text-sm font-bold">
              <i class="fa-solid fa-arrow-left text-xs"></i> 返回博客列表
            </a>
          </div>
        </div>

        <!-- 404 错误 -->
        <div id="articleError" class="hidden text-center py-20">
          <div class="error-icon mb-5">
            <i class="fa-solid fa-magnifying-glass text-2xl"></i>
          </div>
          <h2 class="text-xl font-bold mb-2">文章未找到</h2>
          <p class="muted-text text-sm mb-6">这个页面暂时没有对应的文章。</p>
          <a href="/blog" class="back-button inline-flex items-center gap-2 px-5 py-2.5 text-sm rounded-full">
            <i class="fa-solid fa-arrow-left text-xs"></i> 返回博客
          </a>
        </div>
      </article>

    </div>
  </main>

  <script>
    // 移动端菜单
    var b=document.getElementById('menuBtn'),m=document.getElementById('mobileMenu'),i=document.getElementById('menuIcon');
    b.onclick=function(){var o=m.classList.toggle('open');i.className=o?'fa-solid fa-xmark text-xl':'fa-solid fa-bars text-xl'};
    m.querySelectorAll('a').forEach(function(l){l.onclick=function(){m.classList.remove('open');i.className='fa-solid fa-bars text-xl'}});

    function escapeHtml(text){
      return String(text).replace(/[&<>"']/g,function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    // 文章加载
    (async function(){
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      var header = document.getElementById('articleHeader');
      var body = document.getElementById('articleBody');
      var mdDiv = document.getElementById('markdownContent');

      if(!id){
        showError();
        return;
      }

      try {
        var resp = await fetch('/posts/' + id + '.md');
        if(!resp.ok) throw new Error('Not found');
        var md = await resp.text();

        // 剥离文件顶部的 front matter（--- ... ---），避免渲染到正文
        md = md.replace(/^\uFEFF?---\s*\n[\s\S]*?\n---\s*\n?/, '');

        // 解析 Markdown
        var html = marked.parse(md);

        // 提取第一行作为标题
        var lines = md.trim().split('\n');
        var title = '';
        for(var j=0; j<lines.length; j++){
          var l = lines[j].trim();
          if(l.startsWith('# ') && !l.startsWith('## ')){
            title = l.replace(/^# /,'');
            break;
          }
        }
        if(!title) title = id;

        // 尝试提取日期（查找"> 写于"行）
        var date = '';
        for(var k=0; k<lines.length; k++){
          var d = lines[k].trim();
          var m = d.match(/写于(.+)/);
          if(m){ date = m[1].trim(); break; }
        }

        // 更新页面
        document.title = title + ' · awaw_a';
        header.innerHTML = '<h1 class="article-title text-2xl md:text-4xl font-black mb-3">' + escapeHtml(title) + '</h1>' +
          (date ? '<p class="article-date text-sm">' + escapeHtml(date) + '</p>' : '') +
          '<div class="title-mark mx-auto mt-5"></div>';

        mdDiv.innerHTML = html;
        body.classList.remove('hidden');

        // 代码块滚动处理
        mdDiv.querySelectorAll('pre code').forEach(function(block){
          block.style.display = 'block';
          block.style.overflowX = 'auto';
          block.style.padding = '1rem';
        });

      } catch(e){
        console.error('加载文章失败:', e);
        showError();
      }
    })();

    function showError(){
      document.getElementById('articleHeader').classList.add('hidden');
      document.getElementById('articleBody').classList.add('hidden');
      document.getElementById('articleError').classList.remove('hidden');
      document.title = '404 · awaw_a';
    }
  </script>
</body>
</html>
