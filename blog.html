<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客 · awaw_a</title>
<link rel="icon" type="image/png" href="/favicon.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --paper: #f7f4ea;
    --paper-soft: #fffdf7;
    --ink: #263126;
    --muted: #687260;
    --leaf: #587447;
    --leaf-dark: #33492d;
    --sprout: #91ad77;
    --tomato: #c86b53;
    --amber: #d1a14b;
    --line: #ded8c9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: 'Noto Sans SC', sans-serif;
    overflow-x: hidden;
    color: var(--ink);
    background:
      linear-gradient(90deg, rgba(88,116,71,0.08) 1px, transparent 1px),
      linear-gradient(0deg, rgba(88,116,71,0.08) 1px, transparent 1px),
      repeating-linear-gradient(135deg, rgba(255,255,255,0) 0 28px, rgba(200,107,83,0.045) 28px 29px),
      linear-gradient(135deg, #fbf9f1 0%, #eef4e7 48%, #f7efe3 100%);
    background-size: 42px 42px, 42px 42px, auto, auto;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(88,116,71,0.16), transparent 26%);
    opacity: 0.55;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in-up { animation: fadeInUp 0.7s ease forwards; }
  .fade-in-up:nth-child(1) { animation-delay: 0.05s; }
  .fade-in-up:nth-child(2) { animation-delay: 0.16s; }
  .fade-in-up:nth-child(3) { animation-delay: 0.27s; }
  .fade-in-up:nth-child(4) { animation-delay: 0.38s; }
  .fade-in-up:nth-child(5) { animation-delay: 0.49s; }

  .site-nav {
    background: rgba(255,253,247,0.78);
    border: 1px solid rgba(88,116,71,0.18);
    box-shadow: 0 18px 45px rgba(38,49,38,0.09);
  }
  .brand { color: var(--leaf-dark); letter-spacing: 0; }

  .nav-link {
    position: relative;
    color: var(--muted);
    transition: color 0.25s ease;
    cursor: pointer;
  }
  .nav-link::after {
    content: '';
    position: absolute;
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 2px;
    background: var(--tomato);
    border-radius: 999px;
    transition: width 0.25s ease;
  }
  .nav-link:hover,
  .nav-link.active { color: var(--leaf-dark); }
  .nav-link:hover::after,
  .nav-link.active::after { width: 70%; }

  .social-icon {
    color: #777f71;
    transition: color 0.25s ease, transform 0.25s ease;
  }
  .social-icon:hover { transform: scale(1.14) translateY(-2px); }
  .social-icon.bilibili:hover { color: #00aeec; }
  .social-icon.github:hover { color: #2f342f; }

  .menu-button {
    color: var(--leaf-dark);
    transition: color 0.25s ease, transform 0.25s ease;
  }
  .menu-button:hover { color: var(--tomato); transform: translateY(-1px); }

  .mobile-menu {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, opacity 0.35s ease;
    opacity: 0;
  }
  .mobile-menu.open {
    max-height: 280px;
    opacity: 1;
  }
  .mobile-panel {
    background: rgba(255,253,247,0.86);
    border: 1px solid rgba(88,116,71,0.18);
    box-shadow: 0 18px 42px rgba(38,49,38,0.08);
  }
  .mobile-panel a,
  .mobile-panel span { color: var(--muted); }
  .mobile-panel .active-mobile,
  .mobile-panel a:hover { color: var(--leaf-dark); }

  .page-kicker {
    color: var(--tomato);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
  }
  .page-title {
    color: var(--ink);
    letter-spacing: 0;
  }
  .title-mark {
    width: 4rem;
    height: 0.25rem;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--leaf), var(--tomato));
    opacity: 0.72;
  }
  .page-copy { color: var(--muted); }

  .blog-card {
    background: rgba(255,253,247,0.82);
    border: 1px solid rgba(88,116,71,0.16);
    box-shadow: 0 12px 34px rgba(38,49,38,0.08);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .blog-card:hover {
    transform: translateY(-4px);
    border-color: rgba(88,116,71,0.32);
    box-shadow: 0 18px 48px rgba(38,49,38,0.13);
  }
  .post-date {
    color: #7d8478;
    font-family: 'JetBrains Mono', monospace;
  }
  .post-title { color: var(--ink); }
  .post-desc { color: var(--muted); }
  .read-more {
    color: var(--leaf);
    transition: color 0.2s ease;
  }
  .blog-card:hover .read-more { color: var(--tomato); }

  .tag {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    border: 1px solid transparent;
    padding: 0.125rem 0.55rem;
    font-size: 0.75rem;
  }
  .tag-leaf {
    color: var(--leaf-dark);
    background: rgba(145,173,119,0.18);
    border-color: rgba(88,116,71,0.16);
  }
  .tag-tomato {
    color: #9b4a39;
    background: rgba(200,107,83,0.12);
    border-color: rgba(200,107,83,0.18);
  }
  .tag-amber {
    color: #80612a;
    background: rgba(209,161,75,0.16);
    border-color: rgba(209,161,75,0.24);
  }
  .tag-moss {
    color: #4d613f;
    background: rgba(88,116,71,0.12);
    border-color: rgba(88,116,71,0.18);
  }
  .tag-neutral {
    color: #62685d;
    background: rgba(222,216,201,0.42);
    border-color: rgba(104,114,96,0.12);
  }
</style>
</head>
<body>

  <!-- 导航栏 -->
  <nav class="fixed top-0 left-0 right-0 z-50">
    <div class="mx-auto max-w-6xl px-4 py-3 md:py-4">
      <div class="site-nav backdrop-blur-xl rounded-2xl px-5 md:px-10 py-3 md:py-4 flex items-center justify-between">
        <a href="/" class="brand text-xl md:text-3xl font-bold">awaw_a</a>
        <div class="hidden md:flex items-center gap-10">
          <a href="/" class="nav-link text-sm font-medium">首页</a>
          <a href="/chat" class="nav-link text-sm font-medium">聊天</a>
          <a href="/blog" class="nav-link active text-sm font-bold">博客</a>
          <a href="/changelog" class="nav-link text-sm font-medium">日志</a>
        </div>
        <div class="hidden md:flex items-center gap-5">
          <a href="https://space.bilibili.com/1605536939?spm_id_from=333.788.0.0" target="_blank" rel="noopener" class="social-icon bilibili" aria-label="Bilibili"><i class="fa-brands fa-bilibili text-xl"></i></a>
          <a href="https://github.com/awaw-a" target="_blank" rel="noopener" class="social-icon github" aria-label="GitHub"><i class="fa-brands fa-github text-xl"></i></a>
        </div>
        <button id="menuBtn" class="menu-button md:hidden p-1" aria-label="菜单"><i id="menuIcon" class="fa-solid fa-bars text-xl"></i></button>
      </div>
      <div id="mobileMenu" class="mobile-menu md:hidden">
        <div class="mobile-panel backdrop-blur-xl rounded-xl mt-2 px-6 py-5 flex flex-col gap-4">
          <a href="/" class="text-sm font-medium">首页</a>
          <a href="/chat" class="text-sm font-medium">聊天</a>
          <a href="/blog" class="active-mobile text-sm font-bold">博客</a>
          <a href="/changelog" class="text-sm font-medium">日志</a>
          <div class="flex gap-5 pt-3 border-t" style="border-color: rgba(88,116,71,0.16);">
            <a href="https://space.bilibili.com/1605536939?spm_id_from=333.788.0.0" target="_blank" rel="noopener" class="social-icon bilibili" aria-label="Bilibili"><i class="fa-brands fa-bilibili text-xl"></i></a>
            <a href="https://github.com/awaw-a" target="_blank" rel="noopener" class="social-icon github" aria-label="GitHub"><i class="fa-brands fa-github text-xl"></i></a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="pt-32 md:pt-40 pb-7 text-center px-4">
    <p class="page-kicker text-xs md:text-sm mb-3">NOTES AND PROJECTS</p>
    <h1 class="page-title text-3xl md:text-6xl font-black pb-2">我的博客</h1>
    <p class="page-copy text-sm md:text-lg mt-3 tracking-wide">一些零碎的想法，和不肯放下的热爱。</p>
    <div class="title-mark mx-auto mt-5"></div>
  </section>

  <!-- 文章列表（自动扫描 posts/ 目录生成） -->
  <section class="pb-20 px-4">
    <div id="postList" class="mx-auto max-w-3xl space-y-6">
      <div class="text-center py-16" style="color: var(--muted);">
        <i class="fa-solid fa-circle-notch fa-spin text-xl mb-3"></i>
        <p class="text-sm">文章加载中...</p>
      </div>
    </div>
  </section>

  <script>
    var b=document.getElementById('menuBtn'),m=document.getElementById('mobileMenu'),i=document.getElementById('menuIcon');
    b.onclick=function(){var o=m.classList.toggle('open');i.className=o?'fa-solid fa-xmark text-xl':'fa-solid fa-bars text-xl'};
    m.querySelectorAll('a').forEach(function(l){l.onclick=function(){m.classList.remove('open');i.className='fa-solid fa-bars text-xl'}});

    // 文章列表：优先 /api/posts（server.py 实时扫描），静态部署回退 posts/index.json
    (async function(){
      var list = document.getElementById('postList');

      function escapeHtml(text){
        return String(text).replace(/[&<>"']/g,function(c){
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
      }

      // 标签配色：已知标签保持原风格，新标签按顺序循环配色
      var TAG_STYLE = {
        'AstrBot':'tag-leaf','插件':'tag-moss','JMComic':'tag-amber',
        'TTS':'tag-moss','视频':'tag-tomato','开源':'tag-amber',
        '表情包':'tag-tomato','网站':'tag-leaf','随笔':'tag-neutral',
        'CS2':'tag-tomato','Windows':'tag-leaf'
      };
      var TAG_CYCLE = ['tag-leaf','tag-moss','tag-amber','tag-tomato','tag-neutral'];

      function tagClass(name, idx){
        return TAG_STYLE[name] || TAG_CYCLE[idx % TAG_CYCLE.length];
      }

      async function loadPosts(){
        var sources = ['/api/posts', '/posts/index.json'];
        for(var s=0; s<sources.length; s++){
          try {
            var resp = await fetch(sources[s]);
            if(!resp.ok) continue;
            var data = await resp.json();
            if(data && Array.isArray(data.posts)) return data.posts;
          } catch(e) { /* 尝试下一个来源 */ }
        }
        return null;
      }

      function render(posts){
        if(!posts || !posts.length){
          list.innerHTML = '<div class="text-center py-16" style="color: var(--muted);">' +
            '<i class="fa-regular fa-folder-open text-2xl mb-3"></i>' +
            '<p class="text-sm">还没有文章，去 posts/ 目录写一篇吧。</p></div>';
          return;
        }
        list.innerHTML = posts.map(function(p, idx){
          var tags = (p.tags || []).map(function(t, ti){
            return '<span class="tag ' + tagClass(t, ti) + '">' + escapeHtml(t) + '</span>';
          }).join('');
          return '<a href="/article?id=' + encodeURIComponent(p.id) + '" class="block fade-in-up" style="animation-delay:' + (0.05 + idx * 0.11) + 's">' +
            '<div class="blog-card rounded-2xl p-6 md:p-7">' +
              '<div class="flex flex-wrap items-center gap-2 md:gap-3 mb-3">' +
                (p.date ? '<span class="post-date text-xs">' + escapeHtml(p.date) + '</span>' : '') +
                tags +
              '</div>' +
              '<h2 class="post-title text-lg md:text-xl font-bold mb-2">' + escapeHtml(p.title) + '</h2>' +
              (p.excerpt ? '<p class="post-desc text-sm leading-relaxed line-clamp-2">' + escapeHtml(p.excerpt) + '</p>' : '') +
              '<div class="read-more mt-4 text-xs font-medium">阅读全文 →</div>' +
            '</div></a>';
        }).join('');
      }

      render(await loadPosts());
    })();
  </script>
  <script src="/cursor-trail.js"></script>
</body>
</html>
