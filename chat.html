<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天 · awaw_a</title>
<link rel="icon" type="image/png" href="/favicon.png">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --paper: #f7f4ea;
    --paper-soft: #fffdf7;
    --ink: #263126;
    --muted: #687260;
    --leaf: #587447;
    --leaf-dark: #33492d;
    --sprout: #91ad77;
    --tomato: #c86b53;
    --amber: #d1a14b;
    --line: #ded8c9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: 'Noto Sans SC', sans-serif;
    overflow-x: hidden;
    color: var(--ink);
    background:
      linear-gradient(90deg, rgba(88,116,71,0.08) 1px, transparent 1px),
      linear-gradient(0deg, rgba(88,116,71,0.08) 1px, transparent 1px),
      repeating-linear-gradient(135deg, rgba(255,255,255,0) 0 28px, rgba(200,107,83,0.045) 28px 29px),
      linear-gradient(135deg, #fbf9f1 0%, #eef4e7 48%, #f7efe3 100%);
    background-size: 42px 42px, 42px 42px, auto, auto;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(88,116,71,0.16), transparent 26%);
    opacity: 0.55;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .animate-float { animation: float 3.8s ease-in-out infinite; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in-up { animation: fadeInUp 0.7s ease forwards; }

  .site-nav {
    background: rgba(255,253,247,0.78);
    border: 1px solid rgba(88,116,71,0.18);
    box-shadow: 0 18px 45px rgba(38,49,38,0.09);
  }

  .brand {
    color: var(--leaf-dark);
    letter-spacing: 0;
  }

  .nav-link {
    position: relative;
    color: var(--muted);
    transition: color 0.25s ease;
    cursor: pointer;
  }
  .nav-link::after {
    content: '';
    position: absolute;
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 2px;
    background: var(--tomato);
    border-radius: 999px;
    transition: width 0.25s ease;
  }
  .nav-link:hover,
  .nav-link.active { color: var(--leaf-dark); }
  .nav-link:hover::after,
  .nav-link.active::after { width: 70%; }

  .social-icon {
    color: #777f71;
    transition: color 0.25s ease, transform 0.25s ease;
  }
  .social-icon:hover { transform: scale(1.14) translateY(-2px); }
  .social-icon.bilibili:hover { color: #00aeec; }
  .social-icon.github:hover { color: #2f342f; }

  .menu-button {
    color: var(--leaf-dark);
    transition: color 0.25s ease, transform 0.25s ease;
  }
  .menu-button:hover { color: var(--tomato); transform: translateY(-1px); }

  .mobile-menu {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, opacity 0.35s ease;
    opacity: 0;
  }
  .mobile-menu.open {
    max-height: 260px;
    opacity: 1;
  }
  .mobile-panel {
    background: rgba(255,253,247,0.86);
    border: 1px solid rgba(88,116,71,0.18);
    box-shadow: 0 18px 42px rgba(38,49,38,0.08);
  }
  .mobile-panel a,
  .mobile-panel span {
    color: var(--muted);
  }
  .mobile-panel .active-mobile,
  .mobile-panel a:hover {
    color: var(--leaf-dark);
  }

  .chat-page {
    position: relative;
    min-height: 100vh;
  }

  .profile-rail {
    color: var(--muted);
  }

  .portrait-wrap {
    position: relative;
    isolation: isolate;
  }
  .portrait-wrap::before {
    content: '';
    position: absolute;
    inset: 10%;
    z-index: -1;
    border-radius: 999px;
    border: 1px dashed rgba(88,116,71,0.34);
    transform: rotate(-8deg);
  }
  .portrait-frame {
    background:
      repeating-linear-gradient(145deg, rgba(145,173,119,0.13) 0 12px, rgba(255,253,247,0) 12px 24px),
      linear-gradient(145deg, #edf4e5, #fffaf0);
    border: 8px solid rgba(255,253,247,0.82);
    box-shadow:
      0 22px 55px rgba(38,49,38,0.14),
      inset 0 0 0 1px rgba(88,116,71,0.14);
  }
  .portrait-frame img {
    filter: drop-shadow(0 15px 16px rgba(38,49,38,0.16));
  }

  .online-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    color: var(--leaf-dark);
    background: rgba(255,253,247,0.76);
    border: 1px solid rgba(88,116,71,0.16);
    box-shadow: 0 8px 24px rgba(38,49,38,0.07);
  }
  .online-dot {
    width: 0.48rem;
    height: 0.48rem;
    border-radius: 999px;
    background: #6fa35f;
    box-shadow: 0 0 0 4px rgba(111,163,95,0.14);
  }

  .chat-shell {
    background: rgba(255,253,247,0.76);
    border: 1px solid rgba(88,116,71,0.18);
    box-shadow: 0 24px 70px rgba(38,49,38,0.12);
  }

  .chat-panel {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 8.5rem);
    min-height: 520px;
    max-height: 700px;
  }

  .chat-header {
    border-bottom: 1px solid rgba(88,116,71,0.14);
    background: rgba(255,253,247,0.54);
  }
  .chat-title {
    color: var(--leaf-dark);
  }
  .chat-subtitle {
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .messages-area {
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  .messages-area::-webkit-scrollbar { width: 5px; }
  .messages-area::-webkit-scrollbar-track { background: transparent; }
  .messages-area::-webkit-scrollbar-thumb {
    background: rgba(88,116,71,0.26);
    border-radius: 999px;
  }

  .bubble {
    max-width: min(75%, 34rem);
    padding: 0.75rem 1rem;
    border-radius: 1.1rem;
    line-height: 1.6;
    font-size: 1rem;
    word-break: break-word;
    animation: bubbleIn 0.25s ease;
  }
  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .bubble-user {
    background: var(--leaf-dark);
    color: #fffdf7;
    border-bottom-right-radius: 0.35rem;
    margin-left: auto;
    box-shadow: 0 10px 24px rgba(51,73,45,0.18);
  }

  .bubble-ai {
    background: rgba(255,253,247,0.96);
    color: var(--ink);
    border: 1px solid rgba(88,116,71,0.16);
    border-bottom-left-radius: 0.35rem;
    margin-right: auto;
    box-shadow: 0 8px 22px rgba(38,49,38,0.07);
  }

  .bubble-system {
    background: rgba(200,107,83,0.11);
    color: #9b4a39;
    border: 1px solid rgba(200,107,83,0.22);
    margin: 0 auto;
    font-size: 0.82rem;
    text-align: center;
    max-width: 85%;
  }

  .typing-dots {
    display: flex;
    gap: 5px;
    padding: 0.5rem 0;
  }
  .typing-dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--sprout);
    animation: dotPulse 1.4s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) {
    background: var(--amber);
    animation-delay: 0.2s;
  }
  .typing-dots span:nth-child(3) {
    background: var(--tomato);
    animation-delay: 0.4s;
  }
  @keyframes dotPulse {
    0%, 60%, 100% { transform: scale(0.6); opacity: 0.42; }
    30% { transform: scale(1); opacity: 1; }
  }

  .composer {
    border-top: 1px solid rgba(88,116,71,0.14);
    background: rgba(255,253,247,0.66);
  }

  .chat-input {
    resize: none;
    outline: none;
    color: var(--ink);
    background: rgba(255,253,247,0.9);
    border: 1px solid rgba(88,116,71,0.18);
  }
  .chat-input::placeholder { color: #8a907f; }
  .chat-input:focus {
    border-color: rgba(88,116,71,0.48);
    box-shadow: 0 0 0 3px rgba(88,116,71,0.12);
  }

  .send-button {
    background: var(--leaf-dark);
    color: #fffdf7;
    box-shadow: 0 10px 22px rgba(51,73,45,0.2);
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .send-button:hover {
    background: var(--tomato);
    box-shadow: 0 12px 26px rgba(200,107,83,0.2);
  }
  .send-button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .send-button:not(:disabled):active { transform: scale(0.95); }

  /* 会话侧边栏 */
  .chat-body {
    position: relative;
    display: flex;
    flex: 1;
    min-height: 0;
  }
  .chat-main {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
  }
  .session-sidebar {
    width: 12.5rem;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid rgba(88,116,71,0.14);
    background: rgba(247,244,234,0.55);
  }
  .new-chat-btn {
    width: 100%;
    padding: 0.55rem 0.75rem;
    border-radius: 0.8rem;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--leaf-dark);
    background: rgba(255,253,247,0.9);
    border: 1px dashed rgba(88,116,71,0.4);
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .new-chat-btn:hover { color: var(--tomato); border-color: rgba(200,107,83,0.5); }
  .session-list { flex: 1; overflow-y: auto; }
  .session-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 0.7rem;
    margin-bottom: 0.25rem;
    border-radius: 0.7rem;
    font-size: 0.83rem;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .session-item:hover { background: rgba(145,173,119,0.14); color: var(--ink); }
  .session-item.active {
    background: rgba(145,173,119,0.22);
    color: var(--leaf-dark);
    font-weight: 700;
  }
  .session-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .session-del {
    flex-shrink: 0;
    color: #a8ae9d;
    font-size: 0.75rem;
    opacity: 0;
    transition: opacity 0.2s ease, color 0.2s ease;
  }
  .session-item:hover .session-del { opacity: 1; }
  .session-del:hover { color: var(--tomato); }
  .session-empty {
    padding: 1rem 0.7rem;
    font-size: 0.78rem;
    color: #a8ae9d;
    text-align: center;
  }
  .session-toggle {
    color: var(--leaf-dark);
    transition: color 0.25s ease;
  }
  .session-toggle:hover { color: var(--tomato); }

  /* 附件 */
  .attach-btn {
    color: var(--muted);
    transition: color 0.2s ease, transform 0.2s ease;
  }
  .attach-btn:hover { color: var(--leaf-dark); transform: translateY(-1px); }
  .attach-tray {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 0.6rem;
  }
  .attach-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.35rem 0.6rem;
    border-radius: 0.7rem;
    font-size: 0.78rem;
    color: var(--leaf-dark);
    background: rgba(145,173,119,0.16);
    border: 1px solid rgba(88,116,71,0.2);
    max-width: 14rem;
  }
  .attach-chip.error {
    color: #9b4a39;
    background: rgba(200,107,83,0.12);
    border-color: rgba(200,107,83,0.25);
  }
  .attach-chip .chip-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .attach-chip .chip-thumb {
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 0.4rem;
    object-fit: cover;
  }
  .attach-chip .chip-del {
    color: #a8ae9d;
    transition: color 0.2s ease;
  }
  .attach-chip .chip-del:hover { color: var(--tomato); }
  .attach-chip .chip-spin { color: var(--sprout); }

  .bubble-img {
    display: block;
    max-width: min(16rem, 100%);
    max-height: 16rem;
    border-radius: 0.7rem;
    margin-bottom: 0.4rem;
  }
  .bubble-file {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.35rem 0.6rem;
    border-radius: 0.6rem;
    font-size: 0.8rem;
    background: rgba(88,116,71,0.1);
    color: inherit;
    text-decoration: none;
    margin-bottom: 0.3rem;
    max-width: 100%;
  }
  .bubble-file span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bubble-user .bubble-file {
    background: rgba(255,253,247,0.18);
    color: #fffdf7;
  }

  @media (max-width: 767px) {
    .session-sidebar {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      z-index: 20;
      margin-left: -12.5rem;
      background: rgba(255,253,247,0.97);
      box-shadow: 8px 0 30px rgba(38,49,38,0.1);
      transition: margin-left 0.28s ease;
    }
    .session-sidebar.open { margin-left: 0; }
    .session-del { opacity: 0.6; }
  }

  @media (max-width: 767px) {
    .chat-panel {
      height: calc(100vh - 8rem);
      min-height: 500px;
      max-height: none;
    }
    .bubble {
      max-width: 86%;
      font-size: 0.95rem;
    }
  }
</style>
</head>
<body>

  <!-- ====== 导航栏 ====== -->
  <nav class="fixed top-0 left-0 right-0 z-50">
    <div class="mx-auto max-w-6xl px-4 py-3 md:py-4">
      <div class="site-nav backdrop-blur-xl rounded-2xl px-5 md:px-10 py-3 md:py-4 flex items-center justify-between">

        <a href="/" class="brand text-xl md:text-3xl font-bold">
          awaw_a</a>

        <div class="hidden md:flex items-center gap-10">
          <a href="/" class="nav-link text-sm font-medium">首页</a>
          <a href="/chat" class="nav-link active text-sm font-bold">聊天</a>
          <a href="/blog" class="nav-link text-sm font-medium">博客</a>
          <a href="/changelog" class="nav-link text-sm font-medium">日志</a>
        </div>

        <div class="hidden md:flex items-center gap-5">
          <a href="https://space.bilibili.com/1605536939?spm_id_from=333.788.0.0" target="_blank" rel="noopener" class="social-icon bilibili" aria-label="Bilibili">
            <i class="fa-brands fa-bilibili text-xl"></i></a>
          <a href="https://github.com/awaw-a" target="_blank" rel="noopener" class="social-icon github" aria-label="GitHub">
            <i class="fa-brands fa-github text-xl"></i></a>
        </div>

        <button id="menuBtn" class="menu-button md:hidden p-1" aria-label="菜单">
          <i id="menuIcon" class="fa-solid fa-bars text-xl"></i>
        </button>
      </div>

      <div id="mobileMenu" class="mobile-menu md:hidden">
        <div class="mobile-panel backdrop-blur-xl rounded-xl mt-2 px-6 py-5 flex flex-col gap-4">
          <a href="/" class="text-sm font-medium">首页</a>
          <a href="/chat" class="active-mobile text-sm font-bold">聊天</a>
          <a href="/blog" class="text-sm font-medium">博客</a>
          <a href="/changelog" class="text-sm font-medium">日志</a>
          <div class="flex gap-5 pt-3 border-t" style="border-color: rgba(88,116,71,0.16);">
            <a href="https://space.bilibili.com/1605536939?spm_id_from=333.788.0.0" target="_blank" rel="noopener" class="social-icon bilibili" aria-label="Bilibili">
              <i class="fa-brands fa-bilibili text-xl"></i></a>
            <a href="https://github.com/awaw-a" target="_blank" rel="noopener" class="social-icon github" aria-label="GitHub">
              <i class="fa-brands fa-github text-xl"></i></a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- ====== 主体 ====== -->
  <main class="chat-page pt-24 md:pt-32 pb-6 px-4 fade-in-up">
    <div class="mx-auto max-w-6xl flex flex-col md:flex-row gap-6 md:gap-8">

      <!-- 左侧：动漫角色 -->
      <div class="profile-rail hidden md:flex flex-shrink-0 flex-col items-center justify-center w-48 lg:w-64 animate-float">
        <div class="portrait-wrap">
          <div class="portrait-frame w-40 h-40 lg:w-56 lg:h-56 rounded-full p-5">
            <img src="/avatar_v2.png"
                 alt="角色" class="w-full h-full object-contain" loading="eager">
          </div>
        </div>
        <p class="mt-4 text-xs tracking-wide" style="font-family:'JetBrains Mono',monospace;">Mutsumi · Online</p>
        <span class="online-pill mt-3 rounded-full px-3 py-1.5 text-xs">
          <span class="online-dot"></span>
          在线
        </span>
      </div>

      <!-- 右侧：聊天面板 -->
      <div class="chat-shell flex-1 backdrop-blur-xl rounded-3xl overflow-hidden">
        <div class="chat-panel">

          <div class="chat-header px-4 md:px-8 py-4">
            <div class="flex items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <button id="sessionToggle" class="session-toggle md:hidden p-1" aria-label="会话列表">
                  <i class="fa-solid fa-clock-rotate-left text-lg"></i>
                </button>
                <div>
                  <h1 class="chat-title text-base md:text-lg font-bold">若叶睦</h1>
                  <p class="chat-subtitle text-xs mt-1">Mutsumi · Online</p>
                </div>
              </div>
              <span class="online-pill rounded-full px-3 py-1.5 text-xs">
                <span class="online-dot"></span>
                live
              </span>
            </div>
          </div>

          <div class="chat-body">

            <!-- 会话侧边栏 -->
            <aside id="sessionSidebar" class="session-sidebar">
              <div class="p-3">
                <button id="newChatBtn" class="new-chat-btn">
                  <i class="fa-solid fa-plus text-xs"></i> 新对话
                </button>
              </div>
              <div id="sessionList" class="session-list px-2 pb-3"></div>
            </aside>

            <div class="chat-main">

              <!-- 消息展示区 -->
              <div id="messagesArea" class="messages-area flex-1 px-4 md:px-8 py-5 space-y-4">

                <!-- 默认欢迎消息 -->
                <div class="flex justify-start">
                  <div class="bubble bubble-ai">
                    你好，我是若叶睦。<br>有什么想聊的吗？
                  </div>
                </div>

              </div>

              <!-- 输入区 -->
              <div class="composer px-4 md:px-8 py-4 backdrop-blur-sm">
                <div id="attachTray" class="attach-tray" style="display:none;"></div>
                <div class="flex items-end gap-3">
                  <input type="file" id="fileInput" multiple hidden
                    accept="image/*,video/*,audio/*,.pdf,.txt,.md,.zip,.doc,.docx">
                  <button id="attachBtn" class="attach-btn flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center" aria-label="发送附件" title="发送图片或文件">
                    <i class="fa-solid fa-paperclip text-base"></i>
                  </button>
                  <input id="chatInput" type="text"
                    class="chat-input flex-1 rounded-2xl px-4 py-3 text-sm md:text-base transition-all"
                    placeholder="输入消息，按 Enter 发送..."
                    autocomplete="off">
                  <button id="sendBtn"
                    class="send-button flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                  </button>
                </div>
              </div>

            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- ====== JavaScript ====== -->
  <script>
    // ===== 移动端菜单 =====
    (function(){
      var btn = document.getElementById('menuBtn');
      var menu = document.getElementById('mobileMenu');
      var icon = document.getElementById('menuIcon');
      if(btn && menu){
        btn.onclick = function(){
          var open = menu.classList.toggle('open');
          icon.className = open ? 'fa-solid fa-xmark text-xl' : 'fa-solid fa-bars text-xl';
        };
        var links = menu.querySelectorAll('a');
        for(var i=0; i<links.length; i++){
          links[i].onclick = function(){ menu.classList.remove('open'); icon.className='fa-solid fa-bars text-xl'; };
        }
      }
    })();

    // ===== 聊天核心 =====
    var messagesArea = document.getElementById('messagesArea');
    var chatInput   = document.getElementById('chatInput');
    var sendBtn     = document.getElementById('sendBtn');
    var sessionList = document.getElementById('sessionList');
    var sidebar     = document.getElementById('sessionSidebar');
    var isSending   = false;

    // ===== 访客身份（localStorage 稳定 UUID，实现会话归属隔离） =====
    var USERNAME = localStorage.getItem('aw4w_chat_user') || '';
    if(!USERNAME){
      USERNAME = 'web_' + (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'')
                                             : String(Date.now()) + Math.random().toString(16).slice(2,10));
      localStorage.setItem('aw4w_chat_user', USERNAME);
    }

    var currentSession = localStorage.getItem('aw4w_chat_session') || '';
    var messages = [];   // 当前会话消息 [{role, content, attachments?}]
    var sessions = [];   // 会话列表 [{id, name}]

    // ===== 附件（待发送） =====
    var pendingAttachments = [];  // [{type, attachment_id, name, uploading, error, thumbUrl}]
    var attachTray = document.getElementById('attachTray');
    var fileInput  = document.getElementById('fileInput');
    var attachBtn  = document.getElementById('attachBtn');

    function classifyAttachType(mime){
      if(mime.indexOf('image/') === 0) return 'image';
      if(mime.indexOf('audio/') === 0) return 'record';
      if(mime.indexOf('video/') === 0) return 'video';
      return 'file';
    }

    function attachIcon(type){
      return {image: 'fa-image', record: 'fa-microphone', video: 'fa-video'}[type] || 'fa-file';
    }

    function renderAttachTray(){
      if(!pendingAttachments.length){
        attachTray.style.display = 'none';
        attachTray.innerHTML = '';
        return;
      }
      attachTray.style.display = 'flex';
      attachTray.innerHTML = '';
      pendingAttachments.forEach(function(a, idx){
        var chip = document.createElement('span');
        chip.className = 'attach-chip' + (a.error ? ' error' : '');
        if(a.thumbUrl){
          var img = document.createElement('img');
          img.className = 'chip-thumb';
          img.src = a.thumbUrl;
          chip.appendChild(img);
        } else {
          var ic = document.createElement('i');
          ic.className = 'fa-solid ' + (a.uploading ? 'fa-circle-notch fa-spin chip-spin' : attachIcon(a.type));
          chip.appendChild(ic);
        }
        var name = document.createElement('span');
        name.className = 'chip-name';
        name.textContent = a.error ? (a.name + '（上传失败）') : a.name;
        chip.appendChild(name);
        var del = document.createElement('button');
        del.className = 'chip-del';
        del.innerHTML = '<i class="fa-solid fa-xmark"></i>';
        del.onclick = function(){
          if(a.thumbUrl) URL.revokeObjectURL(a.thumbUrl);
          pendingAttachments.splice(idx, 1);
          renderAttachTray();
        };
        chip.appendChild(del);
        attachTray.appendChild(chip);
      });
    }

    function findAttachmentId(json){
      // 宽容解析 AstrBot 上传响应中的 attachment_id
      if(!json) return '';
      if(json.attachment_id) return json.attachment_id;
      if(json.id) return json.id;
      var d = json.data;
      if(d){
        if(typeof d === 'string') return d;
        return d.attachment_id || d.id || '';
      }
      return '';
    }

    async function uploadFile(file){
      var item = {
        type: classifyAttachType(file.type || ''),
        attachment_id: '',
        name: file.name || '未命名文件',
        uploading: true,
        error: false,
        thumbUrl: (file.type || '').indexOf('image/') === 0 ? URL.createObjectURL(file) : ''
      };
      pendingAttachments.push(item);
      renderAttachTray();
      try {
        var fd = new FormData();
        fd.append('file', file, file.name);
        var resp = await fetch('/api/chat/file', { method: 'POST', body: fd });
        if(!resp.ok) throw new Error('HTTP ' + resp.status);
        var json = await resp.json();
        var aid = findAttachmentId(json);
        if(!aid) throw new Error('no attachment_id');
        item.attachment_id = aid;
      } catch(e){
        console.error('[附件] 上传失败:', e);
        item.error = true;
      }
      item.uploading = false;
      renderAttachTray();
    }

    function clearPendingAttachments(){
      pendingAttachments.forEach(function(a){ if(a.thumbUrl) URL.revokeObjectURL(a.thumbUrl); });
      pendingAttachments = [];
      renderAttachTray();
    }

    function genSessionId(){
      return crypto.randomUUID ? crypto.randomUUID()
                               : 's' + String(Date.now()) + Math.random().toString(16).slice(2,10);
    }

    // ===== 本地消息缓存（AstrBot 不可用时兜底，也用于秒开渲染） =====
    function cacheKey(sid){ return 'aw4w_msgs_' + sid; }
    function loadCache(sid){
      try { return JSON.parse(localStorage.getItem(cacheKey(sid))) || []; }
      catch(e){ return []; }
    }
    function saveCache(){
      if(currentSession) localStorage.setItem(cacheKey(currentSession), JSON.stringify(messages.slice(-100)));
    }
    function clearCache(sid){ localStorage.removeItem(cacheKey(sid)); }

    function scrollBottom(){
      if(messagesArea) messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function createBubble(role, text, attachments){
      var div = document.createElement('div');
      div.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';
      var b = document.createElement('div');
      b.className = 'bubble ' + (role === 'user' ? 'bubble-user' : 'bubble-ai');
      (attachments || []).forEach(function(a){
        var url = '/api/chat/file/' + encodeURIComponent(a.attachment_id) + '/content';
        if(a.type === 'image'){
          var img = document.createElement('img');
          img.className = 'bubble-img';
          img.src = url;
          img.alt = a.name || '图片';
          img.onerror = function(){
            // 图片不可用时降级为文件链接
            var link = document.createElement('a');
            link.className = 'bubble-file';
            link.target = '_blank';
            link.href = url;
            link.innerHTML = '<i class="fa-solid fa-image"></i><span>' + (a.name || '图片') + '</span>';
            img.replaceWith(link);
          };
          b.appendChild(img);
        } else {
          var link = document.createElement('a');
          link.className = 'bubble-file';
          link.target = '_blank';
          link.href = url;
          var ic = document.createElement('i');
          ic.className = 'fa-solid ' + attachIcon(a.type);
          var nm = document.createElement('span');
          nm.textContent = a.name || '附件';
          link.appendChild(ic);
          link.appendChild(nm);
          b.appendChild(link);
        }
      });
      if(text){
        var t = document.createElement('div');
        t.textContent = text;
        b.appendChild(t);
      }
      div.appendChild(b);
      return div;
    }

    function addUserBubble(text, attachments){
      messagesArea.appendChild(createBubble('user', text, attachments));
      scrollBottom();
    }

    function createAiBubble(){
      var div = document.createElement('div');
      div.className = 'flex justify-start';
      var b = document.createElement('div');
      b.className = 'bubble bubble-ai';
      div.appendChild(b);
      messagesArea.appendChild(div);
      return { wrapper: div, bubble: b };
    }

    function addLoading(){
      var div = document.createElement('div');
      div.className = 'flex justify-start';
      div.id = 'loadingBubble';
      var b = document.createElement('div');
      b.className = 'bubble bubble-ai';
      b.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
      div.appendChild(b);
      messagesArea.appendChild(div);
      scrollBottom();
    }

    function removeLoading(){
      var el = document.getElementById('loadingBubble');
      if(el) el.remove();
    }

    function addErrorBubble(text){
      var div = document.createElement('div');
      div.className = 'flex justify-center';
      var b = document.createElement('div');
      b.className = 'bubble bubble-system';
      b.textContent = text;
      div.appendChild(b);
      messagesArea.appendChild(div);
      scrollBottom();
    }

    // ===== 消息区整体渲染 =====
    function renderMessages(){
      messagesArea.innerHTML = '';
      if(!messages.length){
        messagesArea.innerHTML = '<div class="flex justify-start"><div class="bubble bubble-ai">你好，我是若叶睦。<br>有什么想聊的吗？</div></div>';
        return;
      }
      messages.forEach(function(m){
        messagesArea.appendChild(createBubble(m.role, m.content, m.attachments));
      });
      scrollBottom();
    }

    // ===== 会话列表 =====
    function parseSessions(json){
      var d = json && (json.data || json);
      var arr = (d && (d.sessions || d.list)) || (Array.isArray(d) ? d : []);
      return arr.map(function(s){
        return { id: s.session_id || s.id || '', name: s.display_name || s.title || '' };
      }).filter(function(s){ return s.id; });
    }

    function sessionTitle(s){
      if(s.name) return s.name;
      var cached = loadCache(s.id);
      for(var i = 0; i < cached.length; i++){
        if(cached[i].role === 'user' && cached[i].content) return cached[i].content.slice(0, 18);
      }
      return '新对话';
    }

    function renderSessions(){
      sessionList.innerHTML = '';
      if(!sessions.length){
        sessionList.innerHTML = '<p class="session-empty">暂无历史会话</p>';
        return;
      }
      sessions.forEach(function(s){
        var item = document.createElement('div');
        item.className = 'session-item' + (s.id === currentSession ? ' active' : '');
        var title = document.createElement('span');
        title.className = 'session-title';
        title.textContent = sessionTitle(s);
        var del = document.createElement('button');
        del.className = 'session-del';
        del.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
        del.title = '删除会话';
        del.onclick = function(e){ e.stopPropagation(); deleteSession(s.id); };
        item.appendChild(title);
        item.appendChild(del);
        item.onclick = function(){ if(!isSending) switchSession(s.id); };
        sessionList.appendChild(item);
      });
    }

    async function refreshSessions(){
      try {
        var resp = await fetch('/api/chat/sessions?username=' + encodeURIComponent(USERNAME));
        if(!resp.ok) throw new Error('HTTP ' + resp.status);
        sessions = parseSessions(await resp.json());
      } catch(e){ sessions = []; }
      renderSessions();
    }

    // ===== 会话历史 =====
    function parseHistory(json){
      var d = json && (json.data || json);
      var arr = (d && (d.messages || (d.session && d.session.messages))) || [];
      if(!Array.isArray(arr)) return [];
      return arr.map(function(m){
        var role = m.role === 'user' ? 'user' : 'assistant';
        var c = m.content;
        var atts = [];
        if(Array.isArray(c)){
          // 消息段：分离文本与附件
          c = c.map(function(p){
            if(p && p.type && p.attachment_id && p.type !== 'plain'){
              atts.push({ type: p.type, attachment_id: p.attachment_id, name: p.name || '' });
              return '';
            }
            return (p && (p.text || (p.data && p.data.text))) || '';
          }).join('');
        }
        if(c == null) c = m.message || m.text || '';
        return { role: role, content: String(c), attachments: atts };
      }).filter(function(m){ return m.content || (m.attachments && m.attachments.length); });
    }

    async function loadHistory(sid){
      try {
        var resp = await fetch('/api/chat/history?session_id=' + encodeURIComponent(sid));
        if(!resp.ok) throw new Error('HTTP ' + resp.status);
        var msgs = parseHistory(await resp.json());
        if(msgs.length && sid === currentSession){
          messages = msgs;
          saveCache();
          renderMessages();
        }
      } catch(e){ /* 保留本地缓存 */ }
    }

    function closeSidebarMobile(){
      if(sidebar) sidebar.classList.remove('open');
    }

    function switchSession(sid){
      if(sid === currentSession){ closeSidebarMobile(); return; }
      currentSession = sid;
      localStorage.setItem('aw4w_chat_session', sid);
      clearPendingAttachments();
      messages = loadCache(sid);
      renderMessages();
      renderSessions();
      loadHistory(sid);
      closeSidebarMobile();
    }

    function newChat(){
      if(isSending) return;
      currentSession = '';
      localStorage.removeItem('aw4w_chat_session');
      clearPendingAttachments();
      messages = [];
      renderMessages();
      renderSessions();
      closeSidebarMobile();
      chatInput.focus();
    }

    async function deleteSession(sid){
      if(isSending) return;
      if(!confirm('删除这个会话？')) return;
      try {
        await fetch('/api/chat/sessions/' + encodeURIComponent(sid), { method: 'DELETE' });
      } catch(e){}
      clearCache(sid);
      sessions = sessions.filter(function(s){ return s.id !== sid; });
      if(sid === currentSession){ newChat(); } else { renderSessions(); }
    }

    // 从 SSE data JSON 中提取文本片段
    function extractDelta(jsonObj){
      // 直接字段
      if (jsonObj.message) return jsonObj.message.toString();
      if (jsonObj.text)    return jsonObj.text.toString();
      if (jsonObj.content) return jsonObj.content.toString();
      if (jsonObj.reply)   return jsonObj.reply.toString();
      // OpenAI 兼容 delta
      if (jsonObj.choices && jsonObj.choices[0]){
        var c = jsonObj.choices[0];
        if (c.delta && c.delta.content) return c.delta.content;
        if (c.message && c.message.content) return c.message.content;
        if (c.text) return c.text;
      }
      // data 包裹
      if (jsonObj.data){
        if (typeof jsonObj.data === 'string') return jsonObj.data;
        return extractDelta(jsonObj.data);
      }
      return null;
    }

    // ===== 流式发送消息 =====
    async function doSend(){
      if(isSending) return;
      var text = chatInput.value.trim();

      // 已就绪的附件
      var readyAtts = pendingAttachments.filter(function(a){ return !a.uploading && !a.error && a.attachment_id; });
      if(!text && !readyAtts.length){
        if(pendingAttachments.some(function(a){ return a.uploading; })){
          addErrorBubble('附件上传中，请稍候…');
        }
        return;
      }

      // 没有当前会话时创建新会话
      if(!currentSession){
        currentSession = genSessionId();
        localStorage.setItem('aw4w_chat_session', currentSession);
      }

      isSending = true;
      chatInput.disabled = true;
      sendBtn.disabled = true;
      chatInput.value = '';

      var sentAtts = readyAtts.map(function(a){
        return { type: a.type, attachment_id: a.attachment_id, name: a.name };
      });
      addUserBubble(text, sentAtts);
      messages.push({ role: 'user', content: text, attachments: sentAtts });
      saveCache();
      clearPendingAttachments();
      addLoading();

      try {
        var payload = {
          message: text,
          username: USERNAME,
          session_id: currentSession,
          enable_streaming: true
        };
        if(sentAtts.length){
          payload.attachments = sentAtts.map(function(a){
            return { type: a.type, attachment_id: a.attachment_id };
          });
        }
        var response = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });

        if(!response.ok) throw new Error('HTTP ' + response.status);

        removeLoading();
        var ai = createAiBubble();
        var fullText = '';

        // 流式读取 SSE
        var reader = response.body.getReader();
        var decoder = new TextDecoder('utf-8');
        var buffer = '';

        while(true){
          var result = await reader.read();
          if(result.done) break;

          buffer += decoder.decode(result.value, {stream: true});
          // 按行分割
          var lines = buffer.split('\n');
          // 最后一行可能不完整，保留
          buffer = lines.pop() || '';

          for(var i = 0; i < lines.length; i++){
            var line = lines[i].trim();
            if(!line.startsWith('data: ')) continue;
            var jsonStr = line.substring(6); // 去掉 "data: "

            // 跳过 [DONE] 标记
            if(jsonStr === '[DONE]') continue;

            try {
              var jsonObj = JSON.parse(jsonStr);
              var delta = extractDelta(jsonObj);
              if(delta){
                // 去重：如果delta包含之前全部文本，只取新增部分
                if(delta.length > fullText.length && delta.indexOf(fullText) === 0){
                  fullText = delta;
                } else if(delta !== fullText){
                  fullText += delta;
                }
                ai.bubble.textContent = fullText;
                scrollBottom();
              }
            } catch(e){
              // JSON 不完整，跳过
              console.warn('[SSE] 跳过不完整片段:', jsonStr.substring(0,30));
            }
          }
        }

        // 流结束，如果气泡为空则显示提示
        if(!fullText){
          ai.bubble.textContent = '（空回复）';
        } else {
          messages.push({ role: 'assistant', content: fullText });
          saveCache();
        }
        console.log('[AstrBot] 完整回复:', fullText);

      } catch(err){
        removeLoading();
        addErrorBubble('连接失败，请稍后再试');
        console.error('[AstrBot] 错误:', err);
      } finally {
        isSending = false;
        chatInput.disabled = false;
        sendBtn.disabled = false;
        chatInput.focus();
        scrollBottom();
        refreshSessions(); // 新会话出现在列表中
      }
    }

    // ===== 事件绑定 =====
    if(sendBtn) sendBtn.onclick = doSend;
    if(chatInput){
      chatInput.onkeydown = function(e){
        if(e.key === 'Enter' && !e.shiftKey){
          e.preventDefault();
          doSend();
        }
      };
    }
    var newChatBtn = document.getElementById('newChatBtn');
    if(newChatBtn) newChatBtn.onclick = newChat;
    var sessionToggle = document.getElementById('sessionToggle');
    if(sessionToggle && sidebar){
      sessionToggle.onclick = function(){ sidebar.classList.toggle('open'); };
    }
    if(attachBtn && fileInput){
      attachBtn.onclick = function(){ fileInput.click(); };
      fileInput.onchange = function(){
        Array.prototype.forEach.call(fileInput.files || [], function(f){ uploadFile(f); });
        fileInput.value = '';
      };
    }

    // ===== 初始化：恢复上次的会话 =====
    messages = currentSession ? loadCache(currentSession) : [];
    renderMessages();
    if(currentSession) loadHistory(currentSession);
    refreshSessions();
    scrollBottom();
  </script>

</body>
</html>
