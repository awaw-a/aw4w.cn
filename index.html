<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>awaw_a · 若叶睦</title>
<link rel="icon" type="image/png" href="/favicon.png">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --paper: #f7f4ea;
    --paper-soft: #fffdf7;
    --ink: #263126;
    --muted: #687260;
    --leaf: #587447;
    --leaf-dark: #33492d;
    --sprout: #91ad77;
    --tomato: #c86b53;
    --amber: #d1a14b;
    --line: #ded8c9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans SC', sans-serif;
    overflow-x: hidden;
    color: var(--ink);
    background:
      linear-gradient(90deg, rgba(88,116,71,0.08) 1px, transparent 1px),
      linear-gradient(0deg, rgba(88,116,71,0.08) 1px, transparent 1px),
      repeating-linear-gradient(135deg, rgba(255,255,255,0) 0 28px, rgba(200,107,83,0.045) 28px 29px),
      linear-gradient(135deg, #fbf9f1 0%, #eef4e7 48%, #f7efe3 100%);
    background-size: 42px 42px, 42px 42px, auto, auto;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(88,116,71,0.16), transparent 26%);
    opacity: 0.55;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .animate-float { animation: float 3.8s ease-in-out infinite; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in-up { animation: fadeInUp 0.8s ease forwards; }

  .site-nav {
    background: rgba(255,253,247,0.78);
    border: 1px solid rgba(88,116,71,0.18);
    box-shadow: 0 18px 45px rgba(38,49,38,0.09);
  }

  .brand {
    color: var(--leaf-dark);
    letter-spacing: 0;
  }

  .nav-link {
    position: relative;
    color: var(--muted);
    transition: color 0.25s ease;
    cursor: pointer;
  }
  .nav-link::after {
    content: '';
    position: absolute;
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 2px;
    background: var(--tomato);
    border-radius: 999px;
    transition: width 0.25s ease;
  }
  .nav-link:hover,
  .nav-link.active { color: var(--leaf-dark); }
  .nav-link:hover::after,
  .nav-link.active::after { width: 70%; }

  .social-icon {
    color: #777f71;
    transition: color 0.25s ease, transform 0.25s ease;
  }
  .social-icon:hover { transform: scale(1.14) translateY(-2px); }
  .social-icon.bilibili:hover { color: #00aeec; }
  .social-icon.github:hover { color: #2f342f; }

  .menu-button {
    color: var(--leaf-dark);
    transition: color 0.25s ease, transform 0.25s ease;
  }
  .menu-button:hover { color: var(--tomato); transform: translateY(-1px); }

  .mobile-menu {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, opacity 0.35s ease;
    opacity: 0;
  }
  .mobile-menu.open {
    max-height: 260px;
    opacity: 1;
  }
  .mobile-panel {
    background: rgba(255,253,247,0.86);
    border: 1px solid rgba(88,116,71,0.18);
    box-shadow: 0 18px 42px rgba(38,49,38,0.08);
  }
  .mobile-panel a,
  .mobile-panel span {
    color: var(--muted);
  }
  .mobile-panel .active-mobile,
  .mobile-panel a:hover {
    color: var(--leaf-dark);
  }

  .home-main {
    min-height: 100vh;
    position: relative;
  }

  .kicker {
    color: var(--tomato);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
  }

  .hero-title {
    color: var(--ink);
    letter-spacing: 0;
  }
  .hero-title .leaf-name {
    color: var(--leaf);
    position: relative;
    display: inline-block;
  }
  .hero-title .leaf-name::after {
    content: '';
    position: absolute;
    left: 0.08em;
    right: 0.02em;
    bottom: 0.1em;
    height: 0.18em;
    background: rgba(145,173,119,0.34);
    z-index: -1;
    border-radius: 999px;
  }

  .hero-subtitle { color: #73776c; }

  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: #566151;
    background: rgba(255,253,247,0.78);
    border: 1px solid rgba(88,116,71,0.16);
    box-shadow: 0 8px 24px rgba(38,49,38,0.07);
  }
  .status-dot {
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 999px;
    background: #6fa35f;
    box-shadow: 0 0 0 4px rgba(111,163,95,0.14);
  }
  .chip-guitar { color: var(--tomato); }
  .chip-seedling { color: var(--leaf); }

  .portrait-wrap {
    position: relative;
    isolation: isolate;
  }
  .portrait-wrap::before {
    content: '';
    position: absolute;
    inset: 12%;
    z-index: -1;
    border-radius: 999px;
    border: 1px dashed rgba(88,116,71,0.34);
    transform: rotate(-8deg);
  }
  .portrait-frame {
    background:
      repeating-linear-gradient(145deg, rgba(145,173,119,0.13) 0 12px, rgba(255,253,247,0) 12px 24px),
      linear-gradient(145deg, #edf4e5, #fffaf0);
    border: 8px solid rgba(255,253,247,0.82);
    box-shadow:
      0 24px 65px rgba(38,49,38,0.16),
      inset 0 0 0 1px rgba(88,116,71,0.14);
  }
  .portrait-frame img {
    filter: drop-shadow(0 18px 18px rgba(38,49,38,0.16));
  }

  .chat-bubble {
    position: relative;
    min-width: 9.5rem;
    background: rgba(255,253,247,0.96);
    border: 1px solid rgba(88,116,71,0.18);
    border-radius: 1.15rem 1.15rem 1.15rem 0.45rem;
    padding: 0.95rem 1.25rem;
    box-shadow: 0 16px 44px rgba(38,49,38,0.12);
  }
  .chat-bubble::after {
    content: '';
    position: absolute;
    bottom: -9px;
    left: 18px;
    width: 18px;
    height: 18px;
    background: rgba(255,253,247,0.96);
    border-right: 1px solid rgba(88,116,71,0.18);
    border-bottom: 1px solid rgba(88,116,71,0.18);
    transform: rotate(45deg);
  }

  .typing-cursor {
    display: inline-block;
    width: 2px;
    height: 1.1em;
    background: var(--leaf);
    margin-left: 3px;
    animation: blink 0.8s infinite;
    vertical-align: text-bottom;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
</style>
</head>
<body>

  <!-- ====== 导航栏 ====== -->
  <nav class="fixed top-0 left-0 right-0 z-50">
    <div class="mx-auto max-w-6xl px-4 py-3 md:py-4">
      <div class="site-nav backdrop-blur-xl rounded-2xl px-5 md:px-10 py-3 md:py-4 flex items-center justify-between">

        <!-- Logo -->
        <a href="/" class="brand text-xl md:text-3xl font-bold">
          awaw_a</a>

        <!-- 桌面端菜单 -->
        <div class="hidden md:flex items-center gap-10">
          <a href="/" class="nav-link active text-sm font-bold">首页</a>
          <a href="/chat" class="nav-link text-sm font-medium">聊天</a>
          <a href="/blog" class="nav-link text-sm font-medium">博客</a>
          <a href="/changelog" class="nav-link text-sm font-medium">日志</a>
        </div>

        <!-- 桌面端社交图标 -->
        <div class="hidden md:flex items-center gap-5">
          <a href="https://space.bilibili.com/1605536939?spm_id_from=333.788.0.0" target="_blank" rel="noopener" class="social-icon bilibili" aria-label="Bilibili">
            <i class="fa-brands fa-bilibili text-xl"></i>
          </a>
          <a href="https://github.com/awaw-a" target="_blank" rel="noopener" class="social-icon github" aria-label="GitHub">
            <i class="fa-brands fa-github text-xl"></i>
          </a>
        </div>

        <!-- 移动端汉堡按钮 -->
        <button id="menuBtn" class="menu-button md:hidden p-1" aria-label="菜单">
          <i id="menuIcon" class="fa-solid fa-bars text-xl"></i>
        </button>
      </div>

      <!-- 移动端菜单 -->
      <div id="mobileMenu" class="mobile-menu md:hidden">
        <div class="mobile-panel backdrop-blur-xl rounded-xl mt-2 px-6 py-5 flex flex-col gap-4">
          <a href="/" class="active-mobile text-sm font-bold">首页</a>
          <a href="/chat" class="text-sm font-medium">聊天</a>
          <a href="/blog" class="text-sm font-medium">博客</a>
          <a href="/changelog" class="text-sm font-medium">日志</a>
          <div class="flex gap-5 pt-3 border-t" style="border-color: rgba(88,116,71,0.16);">
            <a href="https://space.bilibili.com/1605536939?spm_id_from=333.788.0.0" target="_blank" rel="noopener" class="social-icon bilibili" aria-label="Bilibili">
              <i class="fa-brands fa-bilibili text-xl"></i></a>
            <a href="https://github.com/awaw-a" target="_blank" rel="noopener" class="social-icon github" aria-label="GitHub">
              <i class="fa-brands fa-github text-xl"></i></a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- ====== Hero 区域 ====== -->
  <main class="home-main flex items-center justify-center px-4 md:px-8 pt-24 md:pt-0">

    <!-- 桌面端: 左右flex布局；移动端: 堆叠 -->
    <div class="w-full max-w-6xl flex flex-col md:flex-row items-center justify-between gap-10 md:gap-0">

      <!-- 左侧文字区 -->
      <div class="flex flex-col items-center md:items-start gap-5 md:gap-7 fade-in-up z-20 md:flex-1">

        <!-- 标题 -->
        <div class="text-center md:text-left">
          <p class="kicker text-xs md:text-sm mb-3">WELCOME TO MY SPACE</p>
          <h1 class="hero-title text-3xl md:text-6xl font-bold leading-tight whitespace-nowrap">
            若叶<span class="leaf-name">睦</span>
          </h1>
          <p class="hero-subtitle text-sm md:text-lg mt-3 md:mt-4 whitespace-nowrap">
            guitarist · 月之森女子学园 · Ave Mujica
          </p>
        </div>

        <!-- 状态标签 -->
        <div class="flex flex-wrap justify-center md:justify-start gap-2 md:gap-3">
          <span class="status-chip rounded-full px-3 py-1.5 md:px-5 md:py-2.5 text-xs">
            <span class="status-dot"></span>
            在线
          </span>
          <span class="status-chip rounded-full px-3 py-1.5 md:px-5 md:py-2.5 text-xs">
            <i class="fa-solid fa-guitar chip-guitar"></i>
            吉他手
          </span>
          <span class="status-chip rounded-full px-3 py-1.5 md:px-5 md:py-2.5 text-xs">
            <i class="fa-solid fa-seedling chip-seedling"></i>
            黄瓜种植
          </span>
        </div>
      </div>

      <!-- 右侧: 动漫角色 + 气泡 -->
      <div class="portrait-wrap relative flex-shrink-0 animate-float z-10 md:ml-12">
        <div class="portrait-frame w-44 h-44 md:w-80 md:h-80 rounded-full p-5 md:p-8">
          <img
            src="/avatar_v2.png"
            alt="动漫角色"
            class="w-full h-full object-contain"
            loading="eager"
          >
        </div>

        <!-- 聊天气泡 - 绝对定位在角色右上方 -->
        <div class="absolute -top-3 md:-top-4 -right-7 md:-right-12 lg:-right-20 z-30 animate-float" style="animation-delay: 0.5s;">
          <div class="chat-bubble">
            <span id="typewriter" class="text-sm md:text-base" style="font-family:'JetBrains Mono',monospace;color:var(--ink);"></span>
            <span class="typing-cursor" id="cursor"></span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- ====== 脚本 ====== -->
  <script>
    // 打字机效果
    const text = "hello world!";
    const speed = 110;
    const typewriterEl = document.getElementById('typewriter');
    const cursorEl = document.getElementById('cursor');
    let charIndex = 0;

    function type() {
      if (charIndex < text.length) {
        typewriterEl.textContent += text.charAt(charIndex);
        charIndex++;
        setTimeout(type, speed);
      } else {
        setTimeout(() => { cursorEl.style.display = 'none'; }, 2500);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(type, 500);
    });

    // 移动端菜单
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const menuIcon = document.getElementById('menuIcon');

    menuBtn.addEventListener('click', () => {
      const isOpen = mobileMenu.classList.toggle('open');
      menuIcon.className = isOpen
        ? 'fa-solid fa-xmark text-xl'
        : 'fa-solid fa-bars text-xl';
    });

    mobileMenu.querySelectorAll('span, a').forEach(el => {
      el.addEventListener('click', () => {
        mobileMenu.classList.remove('open');
        menuIcon.className = 'fa-solid fa-bars text-xl';
      });
    });

    // 导航栏激活切换
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });
  </script>

</body>
</html>
